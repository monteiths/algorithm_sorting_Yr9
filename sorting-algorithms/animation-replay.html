const params=new URLSearchParams(location.search);
const lesson=['4','5','6'].includes(params.get('lesson'))?params.get('lesson'):'6';
const animation=params.get('animation')==='1'?'1':'2';
const names={'4':'Bubble sort','5':'Selection sort','6':'Quicksort'};
const title=animation==='1'?'Dealing the cards':names[lesson];
document.title=title+' — replay animation';
const video=document.querySelector('video'),button=document.getElementById('replay'),status=document.getElementById('status');
video.setAttribute('aria-label',title+' animation');
video.src=assets[lesson+'-'+animation];
let started=false;
async function play(){
 started=true;video.currentTime=0;
 try{await video.play();}catch{button.textContent='Play animation';status.textContent='Press Play animation to start.';}
}
button.onclick=()=>video.paused||video.ended?play():video.pause();
video.onplay=()=>{button.textContent='Pause';status.textContent='Playing once…';};
video.onpause=()=>{if(!video.ended){button.textContent='Replay';status.textContent='Paused. Replay starts from the beginning.';}};
video.onended=()=>{button.textContent='Replay';status.textContent='Finished. Press Replay to watch again.';};
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
 const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)&&!started){observer.disconnect();play();}},{threshold:.5});
 observer.observe(video);
}
